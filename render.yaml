services:
  - type: web
    name: mrz-trading-journal
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run seed && npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.14.0
      - key: DATABASE_PATH
        value: /tmp/trading-journal.sqlite
      - key: JWT_SECRET
        sync: false
